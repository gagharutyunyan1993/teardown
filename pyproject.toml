[project]
name = "retool"
version = "0.1.0"
description = "Reverse-engineering toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
retool = "retool.interface.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retool"]

[tool.ruff]
line-length = 100
extend-exclude = ["tools"]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -p no:cacheprovider"

[tool.mypy]
strict = true
files = ["src"]
